<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AssetFixer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      h1 { margin-bottom: 1rem; }
      [hidden] { display: none !important; }
      fieldset { border: 1px solid #80808050; border-radius: 8px; margin: 0.8rem 0; padding: 0.75rem; }
      button, select, input { font: inherit; }
      button { min-height: 2rem; }
      #project-status, #autosave-status, #history-status, #selection-details { font-size: 0.875rem; }

      canvas {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      .model-view { position: relative; }
      #viewport { display: block; width: 100%; }
      #paint-cursor { width: 100%; position: absolute; inset: 0; pointer-events: none; }
      #paint-tools input[type=number] { width: 5.5rem; }
      #paint-target { width: 100%; margin: .35rem 0; }
      #paint-info { font-size: .875rem; margin: .5rem 0 0; }
      #mesh-tools input[type=number] { width: 5.75rem; }
      #mesh-ids { width: min(100%, 22rem); }
      #mesh-info { font-size: .875rem; margin: .5rem 0 0; }
      #repair-tools input[type=number] { width: 5.5rem; }
      .contours { max-height: 16rem; overflow: auto; margin: .65rem 0; }
      .contours table { width: 100%; border-collapse: collapse; font-size: .875rem; }
      .contours th, .contours td { padding: .35rem .4rem; text-align: left; border-bottom: 1px solid #80808042; }
      .contours th { white-space: nowrap; }
      #repair-info { font-size: .875rem; margin: .5rem 0 0; }
      main:has(#uv-tools:not([hidden])) { max-width: 84rem; }
      .work-area:has(#uv-tools:not([hidden])) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 1rem; align-items: start; }
      #uv-tools { min-width: 0; }
      #uv-tools input[type=number] { width: 5rem; }
      #uv-canvas { width: 100%; aspect-ratio: 1.38; touch-action: none; display: block; margin: .65rem 0; }
      #uv-info, #uv-diagnostics { font-size: .875rem; margin: .5rem 0; }
      @media (max-width: 900px) { .work-area:has(#uv-tools:not([hidden])) { grid-template-columns: minmax(0,1fr); } }

      main:has(#texture-panel:not([hidden])) { max-width: 83rem; }
      .work-area:has(#texture-panel:not([hidden])) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 1rem; align-items: start; }
      #texture-panel { min-width: 0; }
      #texture-panel fieldset { min-width: 0; }
      #texture-panel .actions { gap: 0.45rem 0.75rem; }
      #texture-panel select { max-width: 100%; }
      #texture-panel input[type=number] { width: 4.25rem; }
      #texture-target { width: 100%; margin: .35rem 0; }
      #texture-info, #texture-status { font-size: .875rem; min-height: 1.25rem; margin: .55rem 0; overflow-wrap: anywhere; }
      #texture-viewport {
        position: relative; overflow: hidden; touch-action: none; outline-offset: 4px; height: clamp(300px, 46vh, 580px);
        background: repeating-conic-gradient(#333b45 0% 25%, #272e37 0% 50%) 0 / 20px 20px; border-radius: 8px;
      }
      #texture-viewport canvas { position: absolute; left: 0; top: 0; max-width: none; border-radius: 0; pointer-events: none; }
      #texture-picture { transform-origin: 0 0; image-rendering: pixelated; }
      #texture-overlay { width: 100%; height: 100%; }
      @media (max-width: 900px) { .work-area:has(#texture-panel:not([hidden])) { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <main>
      <h1>AssetFixer</h1>
      <fieldset>
        <legend>Project</legend>
        <label for="sources">Open project, GLB, or FBX with its maps</label>
        <div class="actions">
          <input type="file" id="sources" accept=".assetfixer,.glb,.zip,.fbx,.png,.jpg,.jpeg" multiple />
          <button id="save-project" type="button" disabled>Save Project</button>
          <button id="save-copy" type="button" disabled>Save As</button>
          <button id="close-model" type="button" disabled>Close model</button>
        </div>
        <p id="project-status">No open project</p>
        <div class="actions" id="recovery" hidden>
          <button id="restore-autosave" type="button">Restore autosave</button>
          <button id="dismiss-autosave" type="button">Dismiss</button>
        </div>
        <p id="autosave-status" aria-live="polite"></p>
        <details id="project-settings" hidden>
          <summary>Project settings</summary>
          <label for="history-budget">Undo history budget (MiB)</label>
          <input id="history-budget" type="number" min="1" max="512" step="1" />
        </details>
      </fieldset>
      <div class="actions">
        <button id="export" type="button" disabled>Export FBX ZIP</button>
        <button id="unwrap" type="button" disabled>Generate UV atlas</button>
        <button id="rebake" type="button" disabled>Rebake textures</button>
        <button id="paint" type="button" aria-pressed="false" disabled>3D Paint</button>
        <button id="mesh-mode" type="button" aria-pressed="false" disabled>Mesh Edit</button>
        <button id="repair-mode" type="button" aria-pressed="false" disabled>Repair</button>
        <button id="uv-mode" type="button" aria-pressed="false" disabled>UV Editor</button>
        <button id="extract-mode" type="button" aria-pressed="false" disabled>Extract</button>
        <button id="undo-stroke" type="button" disabled>Undo</button>
        <button id="redo" type="button" disabled>Redo</button>
        <button id="toggle-texture" type="button" aria-expanded="false" disabled>Texture editor</button>
        <button id="cancel-job" type="button" hidden>Cancel operation</button>
      </div>
      <p id="history-status" hidden></p>
      <p id="mesh-export-note" hidden></p>
      <p id="status" role="status">Select a model to inspect it locally.</p>
      <div class="work-area">
      <div>
      <fieldset id="viewer-tools" hidden>
        <legend>Viewport</legend>
        <div class="actions">
          <label for="projection">Projection</label>
          <select id="projection"><option>Perspective</option><option>Orthographic</option></select>
          <label for="view-direction">View</label>
          <select id="view-direction"><option>Oblique</option><option>Front</option><option>Back</option><option>Left</option><option>Right</option><option>Top</option><option>Bottom</option></select>
          <button id="frame-all" type="button">Frame all</button>
          <button id="frame-selection" type="button" disabled>Frame selection</button>
        </div>
      </fieldset>
      <fieldset id="paint-tools" hidden>
        <legend>3D Paint</legend>
        <label for="paint-target">Base Color binding</label>
        <select id="paint-target"></select>
        <button id="paint-unwrap" type="button" hidden>Create paint atlas</button>
        <div class="actions">
          <label for="paint-mode">Mode</label>
          <select id="paint-mode"><option value="surface">Surface</option><option value="screen">Screen projection</option><option value="pixel">Texture pixels</option></select>
          <label for="paint-size" id="paint-units">Diameter (scene units)</label><input id="paint-size" type="number" min="0.000001" />
          <label for="paint-color">Color</label><input id="paint-color" type="color" value="#15e4f2" />
          <label for="paint-opacity">Opacity %</label><input id="paint-opacity" type="number" value="100" min="0" max="100" />
          <label for="paint-hardness">Hardness %</label><input id="paint-hardness" type="number" value="75" min="0" max="100" />
          <label><input id="paint-shared" type="checkbox" /> Edit shared map</label>
        </div>
        <div class="actions">
          <label for="paint-mask">Mask</label>
          <select id="paint-mask"><option value="">None</option><option value="face">Selected faces</option><option value="island">Selected UV islands</option>
            <option value="created">New faces</option></select>
          <button id="paint-select" type="button" aria-pressed="false">Pick mask regions</button>
          <button id="paint-clear" type="button">Clear mask</button>
        </div>
        <div class="actions" id="paint-pose" hidden>
          <label for="paint-clip">Frozen pose</label><select id="paint-clip"><option value="">Rest pose</option></select>
          <label for="paint-seconds">Time (s)</label><input id="paint-seconds" type="number" min="0" step="0.01" value="0" />
        </div>
        <p id="paint-info" aria-live="polite"></p>
      </fieldset>
      <div class="model-view">
        <canvas id="viewport" width="640" height="480" tabindex="0" role="img" aria-label="Imported model preview" hidden></canvas>
        <canvas id="paint-cursor" width="640" height="480" aria-hidden="true" hidden></canvas>
      </div>
      <fieldset id="repair-tools" hidden>
        <legend>Boundary Repair</legend>
        <div class="contours">
          <table aria-label="Model boundaries">
            <thead><tr><th>Contour</th><th>Type</th><th>Edges</th><th>Length</th><th>Diameter</th><th>Deviation</th><th>Keep Open</th><th>Result</th></tr></thead>
            <tbody id="repair-contours"></tbody>
          </table>
        </div>
        <div class="actions">
          <label for="repair-method">Method</label>
          <select id="repair-method"><option value="planar">Planar Fill</option><option value="fan">Fan Fill</option></select>
          <label for="repair-material">Material</label><select id="repair-material"><option value="">Adjacent material</option></select>
          <label><input id="repair-project" type="checkbox" /> Project UVs into 0–1</label>
          <label for="repair-tolerance">Planarity tolerance %</label><input id="repair-tolerance" type="number" value="2.5" min="0" max="100" step="any" />
        </div>
        <div class="actions" id="repair-center" hidden>
          <label><input id="repair-custom" type="checkbox" /> Custom Fan center</label>
          <label for="repair-x">X</label><input id="repair-x" type="number" step="any" />
          <label for="repair-y">Y</label><input id="repair-y" type="number" step="any" />
          <label for="repair-z">Z</label><input id="repair-z" type="number" step="any" />
        </div>
        <details id="repair-auto-settings">
          <summary>Auto Fill</summary>
          <div class="actions">
            <label for="repair-scope">Scope</label>
            <select id="repair-scope"><option value="selection">Selected contours</option><option value="object">Selected object</option></select>
            <label for="repair-max-edges">Max edges</label><input id="repair-max-edges" type="number" min="3" step="1" value="8" />
            <label for="repair-max-diameter">Max diameter (0 for any)</label><input id="repair-max-diameter" type="number" min="0" step="any" value="0" />
            <label><input id="repair-allow-planar" type="checkbox" checked /> Planar</label>
            <label><input id="repair-allow-fan" type="checkbox" checked /> Fan</label>
            <button id="repair-auto" type="button">Preview Auto Fill</button>
          </div>
        </details>
        <div class="actions">
          <button id="repair-preview" type="button">Preview Fill</button>
          <button id="repair-manual" type="button">Manual Face</button>
          <button id="repair-apply" type="button" disabled>Apply</button>
          <button id="repair-cancel" type="button" disabled>Cancel preview</button>
          <button id="repair-select-new" type="button" hidden>Select new faces</button>
          <button id="repair-paint-new" type="button" hidden>Paint new faces</button>
        </div>
        <p id="repair-info" aria-live="polite"></p>
      </fieldset>
      <fieldset id="mesh-tools" hidden>
        <legend>Mesh Edit</legend>
        <div class="actions">
          <label for="mesh-kind">Select</label>
          <select id="mesh-kind"><option value="vertex">Vertex</option><option value="edge">Edge</option><option value="face">Face</option></select>
          <label for="mesh-ids">Element IDs</label><input id="mesh-ids" placeholder="Click elements or enter IDs" />
          <button id="mesh-connected" type="button">Select Connected</button>
        </div>
        <div class="actions">
          <label for="mesh-operation">Operation</label>
          <select id="mesh-operation">
            <option value="move">Move</option><option value="rotate">Rotate</option><option value="scale">Scale</option>
            <option value="create">Create Face</option><option value="splitEdge">Split Edge</option><option value="splitFace">Split Face</option>
            <option value="weld">Weld</option><option value="flipEdge">Flip Edge</option><option value="dissolve">Dissolve Edge</option>
            <option value="flipNormals">Flip Normals</option><option value="recalculate">Recalculate Normals</option>
            <option value="separate">Separate</option><option value="delete">Delete</option>
          </select>
        </div>
        <div class="actions" id="mesh-transform">
          <label for="mesh-x">X</label><input id="mesh-x" type="number" value="0" step="any" />
          <label for="mesh-y">Y</label><input id="mesh-y" type="number" value="0" step="any" />
          <label for="mesh-z">Z</label><input id="mesh-z" type="number" value="0" step="any" />
          <label for="mesh-axis">Axis</label><select id="mesh-axis"><option value="">All</option><option>X</option><option>Y</option><option>Z</option></select>
          <label for="mesh-pivot">Pivot</label><select id="mesh-pivot"><option value="">Selection center</option><option value="origin">Object origin</option></select>
        </div>
        <div class="actions" id="mesh-create" hidden>
          <label for="mesh-material">Material</label><select id="mesh-material"></select>
          <label><input id="mesh-project" type="checkbox" /> Project UVs into 0–1</label>
          <label><input id="mesh-chain" type="checkbox" /> Keep last edge</label>
          <button id="mesh-winding" type="button">Flip winding</button>
        </div>
        <div class="actions" id="mesh-weld" hidden>
          <label for="mesh-weld-mode">Weld to</label><select id="mesh-weld-mode"><option value="first">First vertex</option><option value="average">Average</option><option value="tolerance">Within tolerance</option></select>
          <label for="mesh-tolerance">Tolerance</label><input id="mesh-tolerance" type="number" value="0.001" min="0" step="any" />
        </div>
        <div class="actions" id="mesh-split" hidden>
          <label for="mesh-fraction">Position on edge</label><input id="mesh-fraction" type="number" value="0.5" min="0" max="1" step="any" />
        </div>
        <div class="actions">
          <button id="mesh-preview" type="button">Preview</button>
          <button id="mesh-apply" type="button" disabled>Apply</button>
          <button id="mesh-cancel" type="button" disabled>Cancel preview</button>
        </div>
        <p id="mesh-info" aria-live="polite"></p>
      </fieldset>
      <fieldset id="object-tools" hidden>
        <legend>Objects</legend>
        <div class="actions">
          <label for="object-selection">Select object</label>
          <select id="object-selection"></select>
          <button id="object-visibility" type="button" disabled>Hide object</button>
          <label for="object-label">Project label</label>
          <input id="object-label" maxlength="160" disabled />
          <button id="rename-object" type="button" disabled>Apply label</button>
        </div>
        <p id="selection-details"></p>
      </fieldset>
      </div>
      <fieldset id="extract-tools" hidden>
        <legend>Extract Static Assets</legend>
        <div class="actions">
          <label for="extract-selection">Select</label>
          <select id="extract-selection"><option value="all">Whole mesh</option><option value="components">Components</option><option value="faces">Faces</option></select>
          <label for="extract-faces">Face IDs</label><input id="extract-faces" type="text" placeholder="3, 5, 9–14" />
          <button id="extract-face-apply" type="button">Select faces</button>
          <label for="extract-preview"><input id="extract-preview" type="checkbox" /> Isolate selection</label>
        </div>
        <details><summary>Connected components</summary><div id="extract-components" class="actions"></div></details>
        <p id="extract-selection-info"></p>
        <div class="actions">
          <label for="extract-name">Output name</label><input id="extract-name" type="text" maxlength="120" />
          <button id="extract-queue" type="button">Queue selected group</button>
          <button id="extract-queue-components" type="button">Queue separate components</button>
        </div>
        <div id="extract-queue-list"></div>
        <div class="actions">
          <label for="extract-kind">Operation</label>
          <select id="extract-kind"><option value="independent">Make Independent Asset</option><option value="geometry">Separate Geometry</option></select>
          <label for="extract-copy">Source</label><select id="extract-copy"><option value="copy">Copy</option><option value="cut">Cut</option></select>
          <label for="extract-layout">UVs</label>
          <select id="extract-layout"><option value="pack" selected>Pack existing islands</option><option value="keep">Keep UVs</option><option value="unwrap">Auto Unwrap</option></select>
          <label for="extract-size">Map size</label><select id="extract-size"><option>256</option><option>512</option><option selected>1024</option><option>2048</option><option>4096</option></select>
          <label for="extract-padding">Padding (px)</label><input id="extract-padding" type="number" min="0" max="64" value="4" />
          <label><input id="extract-fill" type="checkbox" /> Neutral fill for repairs</label>
        </div>
        <div class="actions">
          <label for="extract-pivot">Pivot</label><select id="extract-pivot"><option value="original">Original</option><option value="center">Bounds center</option><option value="bottom">Bottom center</option><option value="point">Picked or local point</option></select>
          <button id="extract-pick" type="button" aria-pressed="false">Pick pivot on mesh</button>
          <label>Local X <input id="extract-x" type="number" step="any" value="0" /></label>
          <label>Y <input id="extract-y" type="number" step="any" value="0" /></label>
          <label>Z <input id="extract-z" type="number" step="any" value="0" /></label>
        </div>
        <div class="actions">
          <label>Rotate X° <input id="extract-rx" type="number" step="any" value="0" /></label>
          <label>Y° <input id="extract-ry" type="number" step="any" value="0" /></label>
          <label>Z° <input id="extract-rz" type="number" step="any" value="0" /></label>
          <label>Scale <input id="extract-scale" type="number" min="0.000001" step="any" value="1" /></label>
          <label><input id="extract-origin" type="checkbox" /> Export pivot at world zero</label>
        </div>
        <div class="actions">
          <button id="extract-create" type="button">Create selection</button>
          <button id="extract-create-batch" type="button">Create queued groups</button>
          <button id="extract-export" type="button">Export selected asset</button>
          <button id="extract-export-batch" type="button">Export checked assets ZIP</button>
        </div>
        <div id="extract-assets" class="actions"></div>
        <p id="extract-info" aria-live="polite"></p>
      </fieldset>
      <fieldset id="uv-tools" hidden>
        <legend>UV Editor</legend>
        <div class="actions">
          <label for="uv-material">Material</label><select id="uv-material"></select>
          <label for="uv-map">Map</label><select id="uv-map"></select>
          <label for="uv-channel">Channel</label><select id="uv-channel"></select>
          <label for="uv-background">Background</label><select id="uv-background"><option value="texture">Texture</option><option value="checker">Checker</option><option value="solid">Solid</option><option value="coverage">Coverage</option></select>
          <label for="uv-kind">Select</label><select id="uv-kind"><option value="vertex">UV vertex</option><option value="edge">Edge</option><option value="face">Face</option><option value="island">Island</option></select>
        </div>
        <canvas id="uv-canvas" width="768" height="556" tabindex="0" aria-label="UV grid and islands"></canvas>
        <div class="actions">
          <button id="uv-fit" type="button">Fit all</button><button id="uv-fit-selection" type="button">Fit selection</button>
          <button id="uv-select-all" type="button">Select all</button>
          <button id="uv-clear-selection" type="button">Clear selection</button>
          <span id="uv-coordinate"></span>
        </div>
        <p id="uv-diagnostics"></p>
        <div class="actions">
          <label for="uv-operation">Operation</label>
          <select id="uv-operation">
            <option value="move">Move</option><option value="rotate">Rotate</option><option value="scale">Scale</option>
            <option value="alignU">Align U</option><option value="alignV">Align V</option>
            <option value="pixel">Snap to pixels</option><option value="vertex">Snap to nearest vertex</option><option value="boundary">Snap to tile edge</option>
            <option value="cut">Mark seam</option><option value="uncut">Clear seam</option><option value="planar">Planar projection</option>
          </select>
          <label for="uv-u" id="uv-u-label">U</label><input id="uv-u" type="number" value="0" step="any" />
          <label for="uv-v" id="uv-v-label">V</label><input id="uv-v" type="number" value="0" step="any" />
          <label for="uv-pivot">Pivot</label><select id="uv-pivot"><option value="selection">Selection center</option><option value="origin">Origin</option><option value="tile">Tile center</option></select>
          <label for="uv-plane">Plane</label><select id="uv-plane"><option value="">Estimated plane</option><option value="xy">XY</option><option value="xz">XZ</option><option value="yz">YZ</option></select>
          <button id="uv-run" type="button">Update draft</button>
        </div>
        <div class="actions">
          <label for="uv-size">Atlas size</label><select id="uv-size"><option>256</option><option>512</option><option selected>1024</option><option>2048</option><option>4096</option></select>
          <label for="uv-padding">Padding (px)</label><input id="uv-padding" type="number" value="4" min="0" max="64" />
          <label><input id="uv-allow-rotate" type="checkbox" checked /> Allow rotation</label>
          <label><input id="uv-equalize" type="checkbox" /> Equalize texel density</label>
          <label><input id="uv-selected-only" type="checkbox" /> Selected only</label>
          <button id="uv-pack" type="button">Pack islands</button><button id="uv-unwrap" type="button">Auto Unwrap</button>
        </div>
        <div class="actions">
          <label for="uv-mode-select">Apply mode</label><select id="uv-mode-select"><option value="preserve">Preserve Appearance</option><option value="mapping">Change Mapping</option></select>
          <label for="uv-source">Bake source</label><select id="uv-source"><option value="working">Working snapshot</option><option value="original">Original import</option></select>
          <label for="uv-filter">Sampling</label><select id="uv-filter"><option value="linear">Bilinear</option><option value="nearest">Nearest</option></select>
          <label><input id="uv-missing" type="checkbox" /> Neutral fill for repairs</label>
          <button id="uv-apply" type="button">Rebake and Apply</button><button id="uv-cancel" type="button">Cancel draft</button>
        </div>
        <p id="uv-info" aria-live="polite"></p>
      </fieldset>
      <section id="texture-panel" aria-label="Texture editor" hidden>
        <fieldset>
          <legend>Texture editor</legend>
          <label for="texture-target">Object and material</label>
          <select id="texture-target"></select>
          <div class="actions" id="texture-sharing" hidden>
            <button id="texture-edit-shared" type="button">Edit shared map</button>
            <button id="texture-copy" type="button">Copy for this binding</button>
          </div>
          <p id="texture-info"></p>
          <div class="actions">
            <label for="texture-tool">Tool</label>
            <select id="texture-tool"><option value="brush">Brush</option><option value="stamp">Clone Stamp</option><option value="eyedropper">Eyedropper</option><option value="pixel">Pixel Brush</option><option value="select">Rectangle</option><option value="pan">Pan</option></select>
            <label for="texture-color">Color</label><input id="texture-color" type="color" value="#15e4f2" />
            <label for="texture-size">Size (px)</label><input id="texture-size" type="number" min="1" max="512" value="24" />
            <label for="texture-opacity">Opacity %</label><input id="texture-opacity" type="number" min="0" max="100" value="100" />
            <label for="texture-hardness">Hardness %</label><input id="texture-hardness" type="number" min="0" max="100" value="75" />
          </div>
          <div class="actions">
            <label for="texture-shape">Pixel shape</label><select id="texture-shape"><option>Square</option><option>Round</option></select>
            <label for="texture-stamp">Stamp</label><select id="texture-stamp"><option>Aligned</option><option>Fixed</option></select>
            <label><input id="texture-alpha" type="checkbox" /> Edit alpha</label>
            <label for="texture-alpha-value">Alpha</label><input id="texture-alpha-value" type="number" min="0" max="255" value="255" />
            <button id="texture-fill" type="button" disabled>Fill selection</button>
            <button id="texture-clear" type="button" disabled>Clear selection</button>
          </div>
          <div class="actions">
            <button id="texture-fit" type="button">Fit</button>
            <button id="texture-focus" type="button">Focus UVs</button>
            <button id="texture-actual" type="button">100%</button>
            <button id="texture-out" type="button" aria-label="Zoom out">−</button>
            <span id="texture-zoom">100%</span>
            <button id="texture-in" type="button" aria-label="Zoom in">+</button>
            <label><input id="texture-uv" type="checkbox" checked /> UV overlay</label>
            <label for="texture-uv-color">Line color</label><input id="texture-uv-color" type="color" value="#5ee8ff" />
            <label for="texture-uv-opacity">Line opacity %</label><input id="texture-uv-opacity" type="number" min="0" max="100" value="65" />
            <label for="texture-uv-width">Line width</label><input id="texture-uv-width" type="number" min="1" max="5" value="1" />
            <label><input id="texture-unlit" type="checkbox" /> Unlit 3D</label>
          </div>
          <div id="texture-viewport" tabindex="0" aria-label="Texture canvas">
            <canvas id="texture-picture" width="1" height="1" aria-hidden="true"></canvas>
            <canvas id="texture-overlay" width="1" height="1" aria-hidden="true"></canvas>
          </div>
          <p id="texture-status" aria-live="polite"></p>
          <div class="actions">
            <label for="texture-import">Replace Base Color</label><input id="texture-import" type="file" accept=".png,.jpg,.jpeg,.webp" />
            <button id="texture-export" type="button">Export PNG</button>
          </div>
        </fieldset>
      </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
