<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AssetFixer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      canvas {
        max-width: 100%;
        height: auto;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AssetFixer</h1>
      <p>E00 FBX and GLB round-trip prototype</p>
      <div class="actions">
        <label for="sources">Open a self-contained GLB, a Tripo ZIP, or one FBX with its maps</label>
        <input type="file" id="sources" accept=".glb,.zip,.fbx,.png,.jpg,.jpeg" multiple />
        <button id="export" type="button" disabled>Export FBX ZIP</button>
        <button id="unwrap" type="button" disabled>Generate UV atlas</button>
        <button id="rebake" type="button" disabled>Rebake textures</button>
        <button id="paint" type="button" aria-pressed="false" disabled>3D brush (visible projection)</button>
        <label for="paint-color">Brush color</label>
        <input id="paint-color" type="color" value="#15e4f2" disabled />
        <button id="undo-stroke" type="button" disabled>Undo stroke</button>
      </div>
      <p id="status" role="status">Select a model to inspect it locally.</p>
      <canvas id="viewport" width="640" height="480" role="img" aria-label="Imported model preview" hidden></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
